<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div{
        border:10px solid aqua;
    }

    img{
        margin: 10px;
    }
    .container{
        position: relative;
        height: 800px;
    }

    .image2 {
        position:sticky;
        top: 100px;
    }
    .image3 {
        position: fixed;
    }
</style>
<body>
    <div class="container">
        <img 
        src="s1.jpg" 
        alt="image1"
        class="image1"
        width="300px"
        height="300px"
        />
        <img 
        src="s2.jpg" 
        alt="image2"
        class="image2"
        width="300px"
        height="300px"
        />
        <img 
        src="s3.jpg" 
        alt="image3"
        class="image3"
        width="300px"
        height="300px"
        />

    </div>
</body>
</html>
